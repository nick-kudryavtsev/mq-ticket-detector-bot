# Конфигурация Prometheus (Раздел 6 ТЗ)
global:
  scrape_interval: 15s # Интервал сбора метрик из ТЗ

scrape_configs:
  - job_name: node_exporter
    static_configs:
      - targets:
          - node_exporter:9100 # Имя сервиса резолвится внутри сети internal_db

  # Собственные метрики Prometheus: нужны, чтобы проверять, что retention 2d
  # реально действует (prometheus_tsdb_lowest_timestamp_seconds) и что TSDB
  # не разрастается. Один таргет, стоимость сбора незаметна.
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
