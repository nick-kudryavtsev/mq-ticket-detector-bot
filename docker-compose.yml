# ==========================================
# СЕТЕВАЯ ТОПОЛОГИЯ (Раздел 2 ТЗ)
# ==========================================
networks:
  external_web:
    driver: bridge # Имеет доступ в интернет (для скрейпинга и Telegram API)
  internal_db:
    driver: bridge
    internal: true # ПОЛНОСТЬЮ изолирована от интернета (безопасность БД)

# ==========================================
# ПОСТОЯННОЕ ХРАНИЛИЩЕ ДАННЫХ (Раздел 2 ТЗ)
# ==========================================
volumes:
  postgres_data:    # Хранилище для данных пользователей и подписок
  changedet_data:   # Хранилище для настроек и истории скрейпера
  prometheus_data:  # Хранилище для метрик
  grafana_data:     # Хранилище для дашбордов и настроек Grafana

# ==========================================
# ОПИСАНИЕ СЕРВИСОВ
# ==========================================
services:

  # 1. Reverse Proxy (Раздел 3 ТЗ)
  nginx:
    image: nginx:1.25-alpine
    container_name: ticket_nginx
    restart: always
    ports:
      - "80:80"   # Для проверки домена и выпуска SSL
      - "443:443" # Для безопасного приема вебхуков от Telegram
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro # Папка с SSL-сертификатами Let's Encrypt
      - ./nginx/certbot:/var/www/certbot:ro # webroot для ACME-челленджа certbot
    deploy:
      resources:
        limits:
          memory: 64M # Только терминация TLS и проксирование одного пути
    networks:
      - external_web # Доступен извне, передает трафик внутрь
    depends_on:
      - go_backend

  # 2. Go-Бэкенд и Бот (Раздел 5 ТЗ)
  go_backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket_go_backend
    restart: always
    # Запас на graceful shutdown: дослать пачку рассылки, закрыть пул,
    # снять вебхук (дефолтные 10s Docker прерывают процесс SIGKILL-ом)
    stop_grace_period: 30s
    # Порты "8000:8000" НАРУЖУ НЕ ВЫСТАВЛЯЕМ. Доступ только через Nginx.
    env_file:
      - .env # Загрузка токенов и паролей из локального файла
    deploy:
      resources:
        limits:
          # Go-бинарь в distroless: ~30–50 МБ с пулом БД и 8 воркерами рассылки
          memory: 128M
    networks:
      - external_web # Нужен для отправки уведомлений в Telegram API
      - internal_db  # Нужен для безопасной связи с PostgreSQL
    depends_on:
      postgres_db:
        condition: service_healthy # Не стартуем, пока БД не готова принимать соединения
      migrator:
        condition: service_completed_successfully # ...и пока не применены миграции

  # 2.1. Миграции схемы БД (Раздел 4 ТЗ)
  # One-shot контейнер: применяет миграции и завершается.
  # Идемпотентен — при повторном запуске «up» ничего не меняет.
  migrator:
    image: migrate/migrate:v4.17.1
    container_name: ticket_migrator
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    networks:
      - internal_db
    depends_on:
      postgres_db:
        condition: service_healthy
    # ${...} подставляются docker compose из файла .env при разборе yml
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB}?sslmode=disable"
      - "up"

  # 3. База данных PostgreSQL (Раздел 4 ТЗ)
  postgres_db:
    image: postgres:15-alpine
    container_name: ticket_postgres
    restart: always
    # Порты "5432:5432" наружу НЕ выставляем. Доступ закрыт для всего интернета.
    env_file:
      - .env # Считывает POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          # Данных мало (пользователи, шоу, подписки). Дефолтный shared_buffers
          # 128 МБ + соединения укладываются с запасом
          memory: 256M
    networks:
      - internal_db # База находится в полностью изолированной сети
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 4. Внешний скрейпер (Раздел 1 и 2 ТЗ)
  changedetection:
    image: dgtlmoon/changedetection.io:0.45.20
    container_name: ticket_changedetection
    restart: always
    # Веб-интерфейс доступен ТОЛЬКО с localhost сервера (через SSH-туннель).
    # Наружу порт не торчит — весь внешний трафик обязан идти через Nginx.
    # Хостовый порт 5001: на macOS 5000 занят AirPlay Receiver.
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - changedet_data:/datastore
    networks:
      - external_web # Нужен интернет, чтобы проверять сайт Medium Quality
    environment:
      - BASE_URL=http://changedetection:5000
      # JS-страницы (виджеты билетных систем, напр. intickets.ru) рендерит
      # отдельный браузер. Watch с fetch backend «Chrome» ходит сюда.
      - PLAYWRIGHT_DRIVER_URL=ws://sockpuppetbrowser:3000
      # Скриншот хранится ОДИН на watch (last-screenshot.png перезаписывается),
      # по истории изменений не копится. Но дефолтная высота 16000px даёт
      # многомегабайтный PNG и пик RAM при съёмке. Нам нужен верх страницы.
      - SCREENSHOT_MAX_HEIGHT=3000
      # Watch-ей единицы; дефолтные 10 параллельных фетчеров только едят память
      - FETCH_WORKERS=2
    deploy:
      resources:
        limits:
          # Python-приложение: в простое 150–300 МБ. Потолок, чтобы скрейпер
          # не выдавил из памяти бота и БД на машине с 4 ГБ
          memory: 512M
    depends_on:
      - sockpuppetbrowser

  # 4.1. Headless-браузер для JS-страниц (опционально, см. README).
  # Обычные HTML-страницы (Tilda, mediumquality.ru) браузера НЕ требуют —
  # он нужен только для watch-ей с динамической подгрузкой контента.
  sockpuppetbrowser:
    image: dgtlmoon/sockpuppetbrowser:0.0.3 # лёгкий Playwright-браузер от автора changedetection
    container_name: ticket_sockpuppetbrowser
    hostname: sockpuppetbrowser
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN # нужен Chrome для песочницы рендеринга
    networks:
      - external_web # сам загружает целевые страницы → нужен интернет
    deploy:
      resources:
        limits:
          memory: 768M # Chrome прожорлив; рендерит одну страницу за раз. Поднять, если рендер падает по OOM

  # 5. Метрики железа сервера (Раздел 6 ТЗ)
  node_exporter:
    image: prom/node-exporter:v1.8.0
    container_name: ticket_node_exporter
    restart: unless-stopped
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
    deploy:
      resources:
        limits:
          memory: 50M # Жесткий лимит памяти из ТЗ
    networks:
      - internal_db # Доступен только для Prometheus

  # 6. Сборщик метрик Prometheus (Раздел 6 ТЗ)
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: ticket_prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=2d' # Автоудаление метрик старше 48 часов
    deploy:
      resources:
        limits:
          memory: 400M # Жесткий лимит памяти из ТЗ
    networks:
      - internal_db
    depends_on:
      - node_exporter

  # 7. Визуализация метрик Grafana (Раздел 6 ТЗ)
  grafana:
    image: grafana/grafana-oss:10.4.1
    container_name: ticket_grafana
    restart: unless-stopped
    # Панель — только для администратора. Порт слушает ЛОКАЛЬНЫЙ интерфейс
    # сервера, в интернет не торчит и firewall под него открывать не нужно.
    # Доступ: ssh -L 3000:127.0.0.1:3000 <сервер>, затем http://localhost:3000
    # Тот же паттерн, что у changedetection на 5001.
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # Grafana не должна звонить домой: ни телеметрии, ни проверки обновлений.
      # Исходящий доступ у неё появился из-за подключения к external_web (см. networks).
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      # Самостоятельная регистрация и анонимный вход закрыты
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      # Без пароля в .env стек не поднимется — это намеренно,
      # чтобы Grafana не осталась с дефолтным admin/admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?задайте GF_SECURITY_ADMIN_PASSWORD в .env}
    volumes:
      - grafana_data:/var/lib/grafana
      # Data source и провайдер дашбордов — файлами, а не руками в UI
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      resources:
        limits:
          memory: 300M # Жесткий лимит памяти из ТЗ
    networks:
      - internal_db  # связь с Prometheus
      # Нужен только для публикации порта: из сети с internal: true
      # опубликовать порт нельзя. Наружу Grafana всё равно не видна —
      # порт привязан к 127.0.0.1.
      - external_web
    depends_on:
      - prometheus
