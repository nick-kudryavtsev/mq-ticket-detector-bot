# Боевая конфигурация reverse proxy (ТЗ §3).
# Снаружи открыт ТОЛЬКО telegram-вебхук на 443; всё остальное
# (в т.ч. /api/v1/trigger) живёт внутри docker-сетей и наружу не выходит.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    sendfile on;
    keepalive_timeout 65;
    server_tokens off; # не светим версию nginx

    # --- HTTP :80 — только ACME-челлендж и редирект на HTTPS ---
    server {
        listen 80;
        server_name _;

        # webroot для выпуска/продления сертификатов Let's Encrypt (certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS :443 ---
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # Пути Let's Encrypt (ТЗ §3.1). В дев-окружении сюда кладётся
        # самоподписанный сертификат — см. README.
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # Telegram присылает апдейты сюда (BOT_MODE=webhook).
        # Подлинность запроса бэкенд проверяет по заголовку
        # X-Telegram-Bot-Api-Secret-Token.
        location = /telegram/webhook {
            proxy_pass http://go_backend:8000/telegram/webhook;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            client_max_body_size 1m; # апдейты Telegram маленькие
        }

        # ВСЁ остальное снаружи закрыто: /api/v1/trigger доступен только
        # по внутренней сети (changedetection -> go_backend), порты
        # бэкенда и БД наружу не мапятся.
        location / {
            return 404;
        }
    }
}
