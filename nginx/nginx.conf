# Минимальная конфигурация-заглушка для проверки сетевого каркаса.
# TODO(шаг Nginx): добавить server-блок на 443 с SSL (Let's Encrypt),
# проксирование /api/v1/trigger и вебхука Telegram на go_backend:8000.

events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        # Временный ответ, чтобы убедиться, что nginx жив и трафик доходит
        location / {
            return 200 "nginx is up\n";
            add_header Content-Type text/plain;
        }
    }
}
